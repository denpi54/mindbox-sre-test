apiVersion: apps/v1
kind: Deployment
metadata:
  name: mindbox-app
  labels:
    app: mindbox-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mindbox-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: mindbox-app
    spec:
      containers:
        - name: app
          image: your-registry/app:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "500m"
              memory: "128Mi"
            limits:
              cpu: "1"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - mindbox-app
              topologyKey: "topology.kubernetes.io/zone"
